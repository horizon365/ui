name: Deploy Docs

# Build the Nuxt UI documentation site as a **pure static export** and publish
# it to Cloudflare Pages (direct upload with Wrangler).
#
# Why static: Cloudflare's free Worker tier caps the script at 3 MiB gzipped
# and 10 ms CPU per request. The Nitro server bundle for this docs app measures
# ~5.5 MiB gzipped, so a server on Cloudflare needs the paid plan. A static
# export sidesteps both limits (Pages free: unlimited requests, 20,000 files,
# 25 MiB per file) at the cost of the server-only features: /api/ai, /api/chat,
# /api/completion and /mcp. Those entry points are hidden when
# `NUXT_PUBLIC_AI_ENABLED` is not `true`.
#
# The build stays on GitHub Actions because a full 7-locale prerender exceeds
# what a local macOS machine can hold in memory.
#
# Prerequisites (one-time):
#   - Cloudflare Pages project `nuxt-ui-docs` (Direct Upload) whose production
#     branch is `v4`; bind nuxt-ui.vite.js.cn to it in the dashboard.
#   - GitHub secrets: CLOUDFLARE_API_TOKEN (Cloudflare Pages:Edit) and
#     CLOUDFLARE_ACCOUNT_ID.
#   - GitHub secret NUXT_GITHUB_TOKEN (used at build time to prerender the
#     releases/contributors pages; optional but without it GitHub rate-limits).
#   - Optional repository variable NUXT_PUBLIC_SITE_URL to override the
#     production domain baked into canonical/sitemap/hreflang URLs.

on:
  push:
    branches: [v4]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Hoisted node_modules: Nuxt Content's build-time SQLite connector and
      # sharp expect real files, not pnpm's symlink farm.
      - name: Configure pnpm node-linker
        run: echo 'node-linker=hoisted' > .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the UI module stub once (needed before any nuxt build).
      - name: Build UI module stub
        run: pnpm exec nuxt-module-build build --stub

      # Prepare the root .nuxt/tsconfig.json (vite-transform checks for it) and
      # nuxt type stubs once.
      - name: Prepare Nuxt
        working-directory: docs
        run: |
          pnpm exec nuxt prepare
          mkdir -p ../.nuxt && echo '{"compilerOptions":{}}' > ../.nuxt/tsconfig.json

      # --------------------------------------------------------------------------
      # Prerender is split by locale to avoid OOM. `nuxt generate` writes a
      # static site to docs/.output/public; each batch regenerates it, so the
      # first batch is saved and the later ones are merged into it.
      #
      # concurrency=1 keeps prerender memory low (one page at a time).
      # max-old-space-size=12288 fits GitHub's 16GB public-repo runner with
      # ~3.5GB headroom for native modules (sharp, better-sqlite3).
      # --------------------------------------------------------------------------
      - name: Generate batch 1/3 — English (default)
        working-directory: docs
        env:
          PRERENDER_LOCALES: default
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
          NUXT_GITHUB_TOKEN: ${{ secrets.NUXT_GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: pnpm exec nuxt generate

      - name: Save base output
        run: |
          rm -rf /tmp/base-public
          mv docs/.output/public /tmp/base-public
          echo "Base output saved: $(find /tmp/base-public -name '*.html' | wc -l) HTML files"

      - name: Generate batch 2/3 — CJK (zh, ja, ko)
        working-directory: docs
        env:
          PRERENDER_LOCALES: 'zh,ja,ko'
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
          NUXT_GITHUB_TOKEN: ${{ secrets.NUXT_GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: pnpm exec nuxt generate

      - name: Merge CJK output into base
        run: |
          count=0
          while IFS= read -r -d '' f; do
            rel="${f#docs/.output/public/}"
            dest="/tmp/base-public/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
            count=$((count+1))
          done < <(find docs/.output/public -type f -print0)
          echo "Merged $count files from CJK batch"

      - name: Generate batch 3/3 — European (fr, de, nl, es)
        working-directory: docs
        env:
          PRERENDER_LOCALES: 'fr,de,nl,es'
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
          NUXT_GITHUB_TOKEN: ${{ secrets.NUXT_GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: pnpm exec nuxt generate

      - name: Merge European output into base
        run: |
          count=0
          while IFS= read -r -d '' f; do
            rel="${f#docs/.output/public/}"
            dest="/tmp/base-public/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
            count=$((count+1))
          done < <(find docs/.output/public -type f -print0)
          echo "Merged $count files from European batch"

      - name: Restore merged output
        run: |
          rm -rf docs/.output
          mkdir -p docs/.output
          mv /tmp/base-public docs/.output/public
          echo "Total prerendered HTML: $(find docs/.output/public -name '*.html' | wc -l)"
          echo "index.html exists: $(test -f docs/.output/public/index.html && echo yes || echo no)"

      # Pages has no server, so the routeRules redirects become `_redirects`.
      - name: Generate Pages redirects
        run: node docs/scripts/generate-redirects.mjs

      - name: Verify static output
        run: |
          test -f docs/.output/public/index.html
          test -f docs/.output/public/_redirects
          test -f docs/.output/public/zh/index.html
          test ! -e docs/.output/public/api/ai
          test -f docs/.output/public/404.html || echo "WARN: 404.html not generated (Pages falls back to its default 404)"
          echo "Redirects: $(grep -c '' docs/.output/public/_redirects)"
          echo "Files: $(find docs/.output/public -type f | wc -l)"
          du -sh docs/.output/public

      - name: Deploy to Cloudflare Pages
        working-directory: docs
        run: pnpm exec wrangler pages deploy .output/public --project-name=nuxt-ui-docs --branch=v4

      - name: Summary
        run: |
          echo "### Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Target: Cloudflare Pages (static export)" >> $GITHUB_STEP_SUMMARY
          echo "- Custom domain: ${{ vars.NUXT_PUBLIC_SITE_URL || 'https://nuxt-ui.vite.js.cn' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Prerendered HTML: $(find docs/.output/public -name '*.html' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- Server-only features disabled: AI chat, completion, MCP" >> $GITHUB_STEP_SUMMARY

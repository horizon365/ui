name: Deploy Docs

# Build the Nuxt UI documentation site on a Linux runner and deploy to Vercel
# via the Vercel CLI. Building on Linux ensures native modules (sharp, etc.)
# ship the correct linux-x64 binary — avoiding the darwin-arm64 crash that
# occurs when the output is built on macOS and run on Vercel's Linux runtime.
#
# Prerequisites:
#   - GitHub Secret VERCEL_TOKEN  (create at vercel.com/account/tokens)
#
# The build bypasses `vercel build` entirely: it resolves project settings
# from the Vercel API (rootDirectory=docs, framework default `pnpm run build`)
# which bypasses the repo-root vercel.json and dies on the missing root
# .nuxt/tsconfig.json. Instead we run the same commands as the vercel.json
# buildCommand with the Nitro Vercel preset directly (locally verified to
# produce a byte-identical config.json after post-processing).
#
# The deploy uses preview + alias (not --prod) because Vercel Hobby tier
# rejects prod deployments that exceed the 12-serverless-function limit.
# Nitro's vercel preset generates ~300 symlinked functions, so we collapse
# them to a single /__fallback function before deploying (routing-equivalent:
# every symlink pointed to __fallback anyway).

on:
  push:
    branches: [v4]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'vercel.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_eHTWeUVDF2W0o5TQBTfoshCU
      VERCEL_PROJECT_ID: prj_NpCOJ1mN8ZgsDcUdqrKkL5btsrAd

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Hoisted node_modules so Nitro can copy native modules (better-sqlite3,
      # sharp) into the __fallback function dir. pnpm's default symlink layout
      # leaves the function with dangling symlinks that crash at runtime.
      - name: Configure pnpm node-linker
        run: echo 'node-linker=hoisted' > .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel@63.1.0

      # Project linkage for `vercel deploy --prebuilt` / `vercel alias set`.
      # Deliberately NOT running `vercel pull`: it copies the server project
      # settings (rootDirectory=docs) and makes any later vercel command
      # resolve paths from docs/ instead of the repo root.
      - name: Write project linkage
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_NpCOJ1mN8ZgsDcUdqrKkL5btsrAd","orgId":"team_eHTWeUVDF2W0o5TQBTfoshCU","projectName":"ui"}' > .vercel/project.json
          cat .vercel/project.json

      # Mirrors the vercel.json buildCommand (which `vercel build` would run
      # from the repo root) but invoked directly with the Nitro Vercel preset.
      - name: Build docs (Nitro Vercel preset)
        working-directory: docs
        env:
          VERCEL: '1'
          NITRO_PRESET: vercel
          SKIP_PRERENDER: '1'
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          (cd .. && pnpm exec nuxt-module-build build --stub)
          pnpm exec nuxt prepare
          mkdir -p ../.nuxt && echo '{"compilerOptions":{}}' > ../.nuxt/tsconfig.json
          pnpm exec nuxt build

      - name: Collapse symlinked functions
        run: |
          node << 'SCRIPT'
          const fs = require('fs')
          const path = require('path')

          const outputDir = 'docs/.vercel/output'
          const functionsDir = path.join(outputDir, 'functions')

          // 1. Delete all symlinks under functions/ (Nitro creates ~300
          //    symlinks pointing to __fallback.func; keeping them exceeds
          //    Vercel Hobby's 12-function limit and breaks prod deployment).
          function deleteSymlinks(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isSymbolicLink()) {
                fs.unlinkSync(full)
              } else if (entry.isDirectory()) {
                deleteSymlinks(full)
              }
            }
          }
          if (fs.existsSync(functionsDir)) {
            deleteSymlinks(functionsDir)
            // prune empty directories left behind
            const prune = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (entry.isDirectory()) {
                  const full = path.join(dir, entry.name)
                  prune(full)
                  if (fs.readdirSync(full).length === 0) fs.rmdirSync(full)
                }
              }
            }
            prune(functionsDir)
          }

          // 2. Rewrite every non-__fallback dest to /__fallback.
          //    The deleted symlinks pointed to __fallback anyway, and with
          //    SKIP_PRERENDER=1 the prerendered /raw/*.md static files don't
          //    exist either — the single fallback function handles both SSR
          //    and raw markdown at request time. Routing-equivalent.
          const configPath = path.join(outputDir, 'config.json')
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'))
          let count = 0
          for (const route of (config.routes || [])) {
            if (route.dest && route.dest !== '/__fallback') {
              route.dest = '/__fallback'
              count++
            }
          }
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2))
          console.log(`Collapsed ${count} route dests to /__fallback`)
          SCRIPT

      # The .vercel/project.json lives at the repo root, so the Vercel CLI
      # resolves the project root to the repo root and looks for
      # .vercel/output there — not at docs/.vercel/output where Nitro wrote it.
      # Move the output into place (same filesystem, so this is instant).
      - name: Move output to project root
        run: |
          rm -rf .vercel/output
          mv docs/.vercel/output .vercel/output

      # Nitro externalizes some packages (copies them into the function's
      # node_modules) but misses their transitive dependencies. pnpm's
      # symlink layout makes this worse — @modelcontextprotocol/sdk was
      # present but its dep 'content-type' was missing, causing
      # ERR_MODULE_NOT_FOUND at runtime. This step recursively resolves
      # and copies all missing transitive deps from the project node_modules.
      - name: Repair missing transitive deps in function node_modules
        run: |
          node << 'SCRIPT'
          const fs = require('fs')
          const path = require('path')

          const projectNM = path.resolve('node_modules')
          const funcDir = path.resolve('.vercel/output/functions/__fallback.func')
          const funcNM = path.join(funcDir, 'node_modules')

          if (!fs.existsSync(funcNM)) {
            console.log('No node_modules in function dir, skipping')
            process.exit(0)
          }

          const copied = new Set()

          function getDeps(pkgDir) {
            const pj = path.join(pkgDir, 'package.json')
            if (!fs.existsSync(pj)) return []
            try {
              const j = JSON.parse(fs.readFileSync(pj, 'utf8'))
              return Object.keys({ ...j.dependencies, ...j.peerDependencies, ...j.optionalDependencies })
            } catch { return [] }
          }

          function resolvePackage(name) {
            // Check scoped package path
            const direct = path.join(projectNM, name)
            if (fs.existsSync(path.join(direct, 'package.json'))) return direct
            return null
          }

          function copyPackage(name) {
            if (copied.has(name)) return
            const src = resolvePackage(name)
            if (!src) {
              console.log(`  WARN: ${name} not found in project node_modules`)
              return
            }
            const dest = path.join(funcNM, name)
            fs.mkdirSync(path.dirname(dest), { recursive: true })
            if (!fs.existsSync(dest)) {
              fs.cpSync(src, dest, { recursive: true, dereference: true })
              copied.add(name)
              console.log(`  copied: ${name}`)
            }
            // Recursively copy its deps
            for (const dep of getDeps(src)) {
              const depDest = path.join(funcNM, dep)
              if (!fs.existsSync(depDest)) {
                copyPackage(dep)
              }
            }
          }

          // Scan existing packages in function node_modules and fill gaps
          function scanDir(dir, prefix = '') {
            if (!fs.existsSync(dir)) return
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name.startsWith('.')) continue
              if (entry.isDirectory()) {
                if (entry.name.startsWith('@')) {
                  // scoped: check next level
                  scanDir(path.join(dir, entry.name), entry.name + '/')
                } else {
                  const pkgDir = path.join(dir, entry.name)
                  const deps = getDeps(pkgDir)
                  for (const dep of deps) {
                    const depDest = path.join(funcNM, dep)
                    if (!fs.existsSync(depDest)) {
                      copyPackage(dep)
                    }
                  }
                }
              }
            }
          }

          console.log('Scanning function node_modules for missing transitive deps...')
          scanDir(funcNM)
          console.log(`Done. Copied ${copied.size} packages.`)

          // Verify the known-missing package
          const ct = path.join(funcNM, 'content-type', 'package.json')
          console.log(`content-type present: ${fs.existsSync(ct)}`)
          SCRIPT

      # Verify native modules made it into the function directory.
      - name: Verify function bundle
        run: |
          echo "=== .vc-config.json ==="
          cat .vercel/output/functions/__fallback.func/.vc-config.json
          echo ""
          echo "=== native modules in function node_modules ==="
          ls -la .vercel/output/functions/__fallback.func/node_modules/better-sqlite3/build/Release/*.node 2>/dev/null || echo "better-sqlite3 .node NOT FOUND"
          ls -la .vercel/output/functions/__fallback.func/node_modules/@img/sharp-linux-x64/build/Release/*.node 2>/dev/null || echo "sharp .node NOT FOUND"
          echo ""
          echo "=== function dir size ==="
          du -sh .vercel/output/functions/__fallback.func/

      - name: Deploy (production)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --yes --token "${VERCEL_TOKEN}")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Production URL: ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Custom domain: https://nuxt-ui.vite.js.cn" >> $GITHUB_STEP_SUMMARY
